<section #heroSection class="hero">
    <div class="hero__stage">

        <h2 #lineOne class="hero__line hero__line--one">
            START THINKING BIGGER
        </h2>

        <div #heroImage class="hero__image-wrap">
            <img class="hero__image hero__image--human" src="assets/heroImg.png" alt="Portrait photograph"
                loading="eager" draggable="false" />
            <img class="hero__image hero__image--robot" src="assets/herotwo.png" alt="Cybernetic portrait photograph"
                loading="eager" draggable="false" />
        </div>

        <h2 #lineTwo class="hero__line hero__line--two">
            DREAM
        </h2>

        <h2 #lineThree class="hero__line hero__line--three">
            BUILD BETTER
        </h2>

        <div #signatureContainer class="hero__signature-container">
            <svg class="hero__signature-svg" viewBox="0 0 340 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="hero__signature-path" d="M 24 32 L 46 32 L 28 32 L 28 47 L 42 47 L 28 47 L 28 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"
                    fill="none" /> <!-- F -->
                <path class="hero__signature-path"
                    d="M 58 58 C 57 52, 53 52, 51 56 C 49 60, 51 65, 56 65 C 60 65, 60 56, 60 65" stroke="url(#sigGrad)"
                    stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /> <!-- a -->
                <path class="hero__signature-path" d="M 72 65 C 74 58, 76 53, 79 53 C 81 53, 80 58, 82 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- r -->
                <path class="hero__signature-path" d="M 92 65 C 94 58, 96 53, 99 53 C 101 53, 100 58, 102 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- r -->
                <path class="hero__signature-path"
                    d="M 118 58 C 117 52, 113 52, 111 56 C 109 60, 111 65, 116 65 C 120 65, 120 53, 122 53"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- o -->
                <path class="hero__signature-path" d="M 132 53 C 134 61, 136 65, 140 65 C 144 65, 143 53, 146 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- u -->
                <path class="hero__signature-path"
                    d="M 160 58 C 159 52, 155 52, 153 56 C 151 60, 153 65, 158 65 L 158 32 L 158 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- d -->

                <path class="hero__signature-path" d="M 194 65 L 199 30" stroke="url(#sigGrad)" stroke-width="2.8"
                    stroke-linecap="round" stroke-linejoin="round" /> <!-- A left -->
                <path class="hero__signature-path" d="M 199 30 L 204 65" stroke="url(#sigGrad)" stroke-width="2.8"
                    stroke-linecap="round" stroke-linejoin="round" /> <!-- A right -->
                <path class="hero__signature-path" d="M 194 52 L 204 52" stroke="url(#sigGrad)" stroke-width="2.8"
                    stroke-linecap="round" stroke-linejoin="round" /> <!-- A cross -->
                <path class="hero__signature-path"
                    d="M 214 65 C 216 56, 219 53, 222 53 C 224 53, 223 59, 225 65 C 227 56, 230 53, 233 53 C 235 53, 234 59, 236 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- m -->
                <path class="hero__signature-path" d="M 246 65 C 248 58, 250 53, 253 53 L 253 65" stroke="url(#sigGrad)"
                    stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /> <!-- i -->
                <path class="hero__signature-path" d="M 253 40 A 1 1 0 1 1 253 39.9" stroke="url(#sigGrad)"
                    stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /> <!-- i dot -->
                <path class="hero__signature-path" d="M 268 65 C 270 56, 273 53, 276 53 C 278 53, 277 59, 279 65"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- n -->
                <path class="hero__signature-path"
                    d="M 289 65 C 293 59, 299 50, 293 50 C 288 50, 289 58, 294 62 C 297 64, 300 64, 303 64"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <!-- e -->

                <path class="hero__signature-path"
                    d="M 303 64 C 235 78, 140 85, 25 80 C 10 79, 8 72, 15 70 C 25 67, 55 70, 95 73 C 150 76, 220 75, 305 72"
                    stroke="url(#sigGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                <defs>
                    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="50%" stop-color="#e2e8f0" />
                        <stop offset="100%" stop-color="#94a3b8" />
                    </linearGradient>
                </defs>
            </svg>

            <div #pen class="hero__signature-pen">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"
                    style="width: 100%; height: 100%;">
                    <path d="M 10 90 L 25 70 L 40 75 L 35 60 L 80 15 C 85 10 90 15 85 20 L 40 65 L 45 80 L 25 75 Z"
                        fill="url(#penGold)" stroke="#d97706" stroke-width="1.2" />
                    <path d="M 10 90 L 32 68" stroke="#1e293b" stroke-width="1.5" />
                    <circle cx="32" cy="68" r="1.5" fill="#1e293b" />
                    <path d="M 35 60 L 80 15 L 90 25 L 45 70 Z" fill="url(#penBody)" stroke="#0f172a"
                        stroke-width="1" />
                    <path d="M 60 30 L 80 50" stroke="#fbbf24" stroke-width="1.8" />
                    <defs>
                        <linearGradient id="penGold" x1="10" y1="90" x2="80" y2="15">
                            <stop offset="0%" stop-color="#fbbf24" />
                            <stop offset="50%" stop-color="#f59e0b" />
                            <stop offset="100%" stop-color="#d97706" />
                        </linearGradient>
                        <linearGradient id="penBody" x1="35" y1="60" x2="90" y2="25">
                            <stop offset="0%" stop-color="#1e293b" />
                            <stop offset="50%" stop-color="#475569" />
                            <stop offset="100%" stop-color="#0f172a" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <a #cvButton href="assets/cv/cv.pdf" download class="hero__cv-btn">
            <span class="hero__cv-text">Download CV</span>
            <svg class="hero__cv-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
        </a>
    </div>
</section>
